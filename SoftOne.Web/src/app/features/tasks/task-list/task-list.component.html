<mat-card class="app-card task-list-panel">
  <mat-card-header class="task-list-panel__header">
    <mat-card-title>Your Tasks</mat-card-title>
    <mat-card-subtitle>{{ tasks.length }} tasks displayed</mat-card-subtitle>
  </mat-card-header>

  <mat-divider />

  <mat-card-content class="task-list-panel__content">
    <ul class="task-list" role="list">
      @for (task of tasks; track task.id) {
        <li class="task-list__item" role="listitem">
          <app-task-item
            [task]="task"
            (edit)="edit.emit($event)"
            (complete)="complete.emit($event)"
            (delete)="delete.emit($event)"
          />
        </li>
      }
    </ul>

    <p class="task-list-panel__placeholder">
      Task actions are placeholders — dialog and API integration coming in a future phase.
    </p>
  </mat-card-content>
</mat-card>
