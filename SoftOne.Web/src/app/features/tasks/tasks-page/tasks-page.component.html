<div class="tasks-page">
  <header class="tasks-page__header">
    <div class="tasks-page__intro">
      <h1 class="tasks-page__title">Task Dashboard</h1>
      <p class="tasks-page__subtitle">
        View, filter, and manage tasks. Create or edit tasks using the dialog workflow.
      </p>
    </div>
  </header>

  <section class="tasks-page__toolbar-section app-card" aria-label="Dashboard toolbar">
    <div class="tasks-page__toolbar">
      <app-task-toolbar class="tasks-page__toolbar-filters" />
      <button
        mat-flat-button
        color="accent"
        type="button"
        class="tasks-page__create-btn btn-rounded"
        [disabled]="isLoading || isActionInProgress"
        (click)="onCreateTask()"
      >
        <mat-icon aria-hidden="true">add</mat-icon>
        Create Task
      </button>
    </div>
  </section>

  <section class="tasks-page__list-section" aria-label="Task list">
    <app-task-list
      [tasks]="tasks"
      [loading]="isLoading"
      [actionsDisabled]="isActionInProgress"
      (edit)="onEditTask($event)"
      (complete)="onCompleteTask($event)"
      (delete)="onDeleteTask($event)"
    />
  </section>
</div>
