<div class="tasks-page">
  <header class="tasks-page__header">
    <h1 class="tasks-page__title">Task Dashboard</h1>
    <p class="tasks-page__subtitle">
      Manage tasks with a side-by-side list and form on desktop, stacked on mobile.
    </p>
  </header>

  <div class="tasks-page__dashboard dashboard-split">
    <section
      class="tasks-page__panel tasks-page__panel--list dashboard-split__panel dashboard-split__panel--list"
      aria-label="Task list panel"
    >
      <app-task-list />
    </section>

    <section
      class="tasks-page__panel tasks-page__panel--form dashboard-split__panel dashboard-split__panel--form"
      aria-label="Task form panel"
    >
      <app-task-form />
    </section>
  </div>
</div>
