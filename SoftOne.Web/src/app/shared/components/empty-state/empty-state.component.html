<div class="empty-state" role="status" [attr.aria-label]="title()">
  <div class="empty-state__icon-wrap" aria-hidden="true">
    <mat-icon>{{ icon() }}</mat-icon>
  </div>

  <p class="empty-state__title">{{ title() }}</p>

  @if (hint()) {
    <p class="empty-state__hint">{{ hint() }}</p>
  }

  @if (actionLabel()) {
    <button
      mat-flat-button
      color="accent"
      type="button"
      class="empty-state__action btn-rounded"
      (click)="onAction()"
    >
      <mat-icon aria-hidden="true">add</mat-icon>
      {{ actionLabel() }}
    </button>
  }
</div>
