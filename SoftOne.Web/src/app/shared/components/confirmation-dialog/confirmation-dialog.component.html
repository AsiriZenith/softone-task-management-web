<div class="confirmation-dialog">
  <div class="confirmation-dialog__header">
    <div
      class="confirmation-dialog__icon"
      [class.confirmation-dialog__icon--destructive]="isDestructive"
      aria-hidden="true"
    >
      <mat-icon>{{ icon }}</mat-icon>
    </div>
    <h2 mat-dialog-title id="confirmation-dialog-title">{{ data.title }}</h2>
  </div>

  <mat-dialog-content>
    <p class="confirmation-dialog__message" id="confirmation-dialog-message">
      {{ data.message }}
    </p>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="confirmation-dialog__actions">
    <button mat-button type="button" (click)="cancel()">{{ cancelLabel }}</button>
    <button
      mat-flat-button
      type="button"
      class="btn-rounded"
      [color]="isDestructive ? 'warn' : 'accent'"
      (click)="confirm()"
    >
      {{ confirmLabel }}
    </button>
  </mat-dialog-actions>
</div>
