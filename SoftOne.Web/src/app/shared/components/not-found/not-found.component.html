<div class="not-found">
  <mat-card class="app-card not-found__card">
    <mat-card-header>
      <mat-card-title>Page Not Found</mat-card-title>
      <mat-card-subtitle>Error 404</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p class="not-found__message">
        The page you are looking for does not exist or has been moved.
      </p>
    </mat-card-content>

    <mat-card-actions align="end">
      <a mat-button color="primary" routerLink="/tasks">Go to Tasks</a>
    </mat-card-actions>
  </mat-card>
</div>
