<mat-toolbar class="app-toolbar" color="primary">
  <div class="app-toolbar__inner app-container app-container--fluid">
    <div class="app-toolbar__brand-group">
      <mat-icon class="app-toolbar__logo" aria-hidden="true">task_alt</mat-icon>
      <span class="app-toolbar__brand">SoftOne</span>
      <span class="app-toolbar__subtitle hide-mobile">Task Management</span>
    </div>

    @if (isAuthenticated$ | async) {
      <div class="app-toolbar__actions">
        @if (currentUsername$ | async; as username) {
          <span class="app-toolbar__user hide-mobile">{{ username }}</span>
        }
        <button
          mat-button
          type="button"
          class="app-toolbar__logout"
          (click)="logout()"
          aria-label="Logout"
        >
          <mat-icon aria-hidden="true">logout</mat-icon>
          <span class="app-toolbar__logout-label">Logout</span>
        </button>
      </div>
    }
  </div>
</mat-toolbar>
